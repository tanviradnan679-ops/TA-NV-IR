
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TA-NV-IR | My Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071426;
      color: #fff;
    }

    header {
      background: #102746;
      text-align: center;
      padding: 28px 15px;
      border-bottom: 2px solid #00d9ff;
    }

    header h1 {
      color: #00d9ff;
      margin: 0 0 10px;
      font-size: 32px;
    }

    header p {
      margin: 0;
      color: #d7e9ff;
    }

    main {
      max-width: 650px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: #102746;
      border: 1px solid #245078;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h2 {
      color: #00d9ff;
      margin-top: 0;
    }

    input, textarea {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      border: 1px solid #5082a9;
      border-radius: 8px;
      background: #071426;
      color: #fff;
      font-size: 16px;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    button {
      padding: 11px 16px;
      margin: 5px 5px 5px 0;
      border: none;
      border-radius: 8px;
      background: #00d9ff;
      color: #071426;
      font-weight: bold;
      cursor: pointer;
    }

    button.delete {
      background: #ff4d5a;
      color: #fff;
    }

    button.logout {
      background: #ffc857;
    }

    .note {
      background: #071426;
      border: 1px solid #245078;
      border-radius: 10px;
      padding: 14px;
      margin-top: 14px;
      overflow-wrap: anywhere;
    }

    .note h3 {
      color: #00d9ff;
    }

    #login-message {
      color: #ff8585;
    }

    footer {
      text-align: center;
      padding: 22px 12px;
      color: #b9c8d8;
      border-top: 1px solid #245078;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <header>
    <h1>TA-NV-IR</h1>
    <p>Welcome to My Website</p>
  </header>

  <main>

    <section class="card">
      <h2>About Me</h2>
      <p>Hello! I am a student interested in electronics,
      circuits and technology.</p>
      <p>Email: tanviradnan679@gmail.com</p>
      <p>Location: Dinajpur, Bangladesh</p>
    </section>

    <section class="card">
      <h2>Admin Login</h2>

      <div id="auth-area">
        <input
          type="email"
          id="email"
          placeholder="Admin Email"
          autocomplete="username"
        >

        <input
          type="password"
          id="password"
          placeholder="Admin Password"
          autocomplete="current-password"
        >

        <button id="login-btn" type="button">Login</button>
        <p id="login-message" role="status"></p>
      </div>

      <div id="notes-area" hidden>
        <h2>My Notes</h2>

        <input
          type="text"
          id="note-title"
          placeholder="Note Title"
          maxlength="150"
        >

        <textarea
          id="note-body"
          placeholder="Write your note..."
          maxlength="10000"
        ></textarea>

        <button id="save-note-btn" type="button">
          Save Note
        </button>

        <button id="logout-btn" class="logout" type="button">
          Logout
        </button>

        <div id="notes-list"></div>
      </div>
    </section>

  </main>

  <footer>
    © 2026 TA-NV-IR | All Rights Reserved
  </footer>

  <script>
    "use strict";

    // Admin account
    const ADMIN_EMAIL = "tanviradnan679@gmail.com";

    // CHANGE_THIS_PASSWORD-এর জায়গায় নিজের নতুন পাসওয়ার্ড বসাও।
    const ADMIN_PASSWORD = "tanvir@5699";

    const NOTES_KEY = "tanvir_notes";
    const SESSION_KEY = "tanvir_admin_logged_in";

    const $ = (id) => document.getElementById(id);

    function isLoggedIn() {
      return sessionStorage.getItem(SESSION_KEY) === "yes";
    }

    function login() {
      const email = $("email").value.trim();
      const password = $("password").value;

      if (
        email === ADMIN_EMAIL &&
        password === ADMIN_PASSWORD
      ) {
        sessionStorage.setItem(SESSION_KEY, "yes");
        $("password").value = "";
        $("login-message").textContent = "";
        updateView();
      } else {
        $("login-message").textContent =
          "Email or password is incorrect!";
      }
    }

    function logout() {
      sessionStorage.removeItem(SESSION_KEY);
      $("email").value = "";
      $("password").value = "";
      updateView();
    }

    function getNotes() {
      try {
        const notes = JSON.parse(
          localStorage.getItem(NOTES_KEY) || "[]"
        );

        return Array.isArray(notes) ? notes : [];
      } catch (error) {
        return [];
      }
    }

    function saveNote() {
      if (!isLoggedIn()) {
        alert("Please login first!");
        return;
      }

      const title = $("note-title").value.trim();
      const body = $("note-body").value.trim();

      if (!title && !body) {
        alert("Please write a note first!");
        return;
      }

      const notes = getNotes();

      notes.push({
        id: Date.now().toString() +
          Math.random().toString(16).slice(2),
        title: title,
        body: body,
        date: new Date().toLocaleString()
      });

      try {
        localStorage.setItem(
          NOTES_KEY,
          JSON.stringify(notes)
        );
      } catch (error) {
        alert("Note save failed. Browser storage may be full.");
        return;
      }

      $("note-title").value = "";
      $("note-body").value = "";

      showNotes();
      alert("Note saved successfully!");
    }

    function deleteNote(id) {
      if (!isLoggedIn()) return;

      if (!confirm("Do you want to delete this note?")) {
        return;
      }

      const notes = getNotes().filter(
        (note) => note.id !== id
      );

      localStorage.setItem(
        NOTES_KEY,
        JSON.stringify(notes)
      );

      showNotes();
    }

    function showNotes() {
      const list = $("notes-list");
      list.replaceChildren();

      const notes = getNotes();

      if (notes.length === 0) {
        const empty = document.createElement("p");
        empty.textContent = "No notes yet.";
        list.appendChild(empty);
        return;
      }

      notes.slice().reverse().forEach((note) => {
        const card = document.createElement("div");
        card.className = "note";

        const heading = document.createElement("h3");
        heading.textContent = note.title || "Untitled";

        const paragraph = document.createElement("p");
        paragraph.textContent = note.body || "";

        const date = document.createElement("small");
        date.textContent = note.date || "";

        const deleteButton = document.createElement("button");
        deleteButton.type = "button";
        deleteButton.className = "delete";
        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", () => {
          deleteNote(note.id);
        });

        card.append(
          heading,
          paragraph,
          date,
          document.createElement("br"),
          deleteButton
        );

        list.appendChild(card);
      });
    }

    function updateView() {
      const loggedIn = isLoggedIn();

      $("auth-area").hidden = loggedIn;
      $("notes-area").hidden = !loggedIn;

      if (loggedIn) {
        showNotes();
      }
    }

    $("login-btn").addEventListener("click", login);
    $("logout-btn").addEventListener("click", logout);
    $("save-note-btn").addEventListener("click", saveNote);

    $("password").addEventListener("keydown", (event) => {
      if (event.key === "Enter") login();
    });

    $("email").addEventListener("keydown", (event) => {
      if (event.key === "Enter") login();
    });

    updateView();
  </script>

</body>
